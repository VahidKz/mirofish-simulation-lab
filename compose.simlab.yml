# Modified 2026-10-29 for the independent Simulation Lab edition; see NOTICE and MODIFICATIONS.md.
name: simlab-simulation
services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set local Neo4j password in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: ["neo4j_data:/data"]
    mem_limit: 1500m
  ollama:
    image: ollama/ollama:0.12.6
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    mem_limit: 2g
volumes:
  neo4j_data:
  ollama_data:
